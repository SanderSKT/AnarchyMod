name: Build AnarchyMod 9b9t (Minecraft 1.21.11)

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'versions/1.21.11/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-1.21.11.yml'
  workflow_dispatch:

jobs:
  build-1-21-11:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout patched sources
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Compile and test Minecraft 1.21.11
        run: gradle :1.21.11:build --stacktrace
      - name: Upload compiled Fabric JAR
        uses: actions/upload-artifact@v4
        with:
          name: anarchymod-9b9t-minecraft-1.21.11
          path: |
            versions/1.21.11/build/libs/*.jar
            !versions/1.21.11/build/libs/*-sources.jar
            !versions/1.21.11/build/libs/*-dev.jar
          if-no-files-found: error
